<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f8eee9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="L'Art des Recettes" />
  <style>

:root{
  --bg:#fffaf6;
  --panel:#ffffff;
  --ink:#2e2b2a;
  --muted:#7b7470;
  --rose:#efd7d2;
  --rose-strong:#c8827a;
  --green:#dcebd8;
  --green-strong:#6e9864;
  --line:#ece3dd;
  --shadow:0 12px 30px rgba(71,53,45,.08);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
body{min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
#app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:96px}
.topbar{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:calc(16px + env(safe-area-inset-top)) 20px 14px;background:rgba(255,250,246,.94);backdrop-filter:blur(16px);border-bottom:1px solid rgba(236,227,221,.7)}
.topbar h1{font-size:25px;margin:2px 0 0;letter-spacing:-.5px}
.eyebrow{font-size:11px;letter-spacing:.14em;font-weight:800;color:var(--rose-strong);margin:0}
.icon-btn{width:42px;height:42px;border:0;border-radius:14px;background:var(--green);font-size:28px;color:#385a34}
main{padding:18px 18px 0}
.view{display:none}
.view.active{display:block}
.search-wrap{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 4px 18px rgba(71,53,45,.04)}
.search-wrap input{width:100%;border:0;outline:0;background:transparent;font-size:16px}
.hero-card{margin:18px 0 24px;background:linear-gradient(135deg,#f5e4df,#ecf3e9);border-radius:24px;padding:22px;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;box-shadow:var(--shadow)}
.hero-card h2{font-size:25px;line-height:1.15;margin:8px 0}
.hero-card p:last-child{color:#5d5754;margin-bottom:0}
.hero-mark{font-size:56px}
.section-title-row{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 12px}
.section-title-row h2,.section-title-row h3{margin:0}
.text-btn{border:0;background:none;color:var(--green-strong);font-weight:700}
.muted{color:var(--muted);font-size:14px}
.category-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.category-card{border:0;border-radius:18px;padding:16px;text-align:left;background:#fff;box-shadow:0 6px 18px rgba(71,53,45,.05);border:1px solid var(--line)}
.category-card .emoji{font-size:28px;display:block;margin-bottom:10px}
.category-card strong{display:block}
.category-card small{color:var(--muted)}
.recipe-list{display:grid;gap:12px}
.recipe-card{display:grid;grid-template-columns:82px 1fr auto;gap:13px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 6px 18px rgba(71,53,45,.04)}
.recipe-thumb{width:82px;height:82px;border-radius:14px;background:linear-gradient(145deg,var(--rose),var(--green));display:flex;align-items:center;justify-content:center;font-size:34px}
.recipe-meta h4{margin:0 0 6px;font-size:16px}
.recipe-meta p{margin:0;color:var(--muted);font-size:13px}
.open-btn,.fav-btn{border:0;background:none}
.open-btn{font-size:28px;color:#9b8f89}
.fav-btn{font-size:24px;color:var(--rose-strong)}
.back-btn{border:0;background:none;padding:8px 0 12px;color:var(--green-strong);font-weight:750;font-size:16px}
.detail-card{background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
.detail-hero{min-height:180px;background:linear-gradient(135deg,var(--rose),var(--green));padding:24px;display:flex;flex-direction:column;justify-content:flex-end}
.detail-hero .dish-icon{font-size:52px}
.detail-hero h2{font-size:29px;margin:10px 0 4px}
.detail-hero p{margin:0;color:#5d5754}
.detail-body{padding:20px}
.servings-control{display:flex;align-items:center;justify-content:space-between;background:#faf6f3;border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:22px}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:36px;height:36px;border:0;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:21px}
.stepper strong{min-width:38px;text-align:center}
.ingredients{display:grid;gap:9px;padding:0;list-style:none}
.ingredients li{display:grid;grid-template-columns:95px 1fr;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.ingredients .qty{font-weight:800;color:#4f6f49}
.steps{padding-left:22px}
.steps li{margin-bottom:12px;line-height:1.45}
.info-box{margin-top:18px;padding:14px;border-radius:16px;background:#f3f8f1}
.note-box{margin-top:14px;padding:14px;border-radius:16px;background:#fff4f0}
.detail-actions{display:flex;gap:10px;margin-top:18px}
.secondary-btn,.primary-btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800}
.primary-btn{background:var(--green-strong);color:#fff;width:100%}
.secondary-btn{background:#f8ebe7;color:#7b4a45}
.recipe-form{display:grid;gap:15px}
.recipe-form label{display:grid;gap:7px;font-weight:700}
.recipe-form input,.recipe-form textarea,.recipe-form select{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;outline:none}
.recipe-form textarea{resize:vertical}
.hint{font-size:12px;color:var(--muted);margin:-8px 0 0}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(760px,100%);display:grid;grid-template-columns:repeat(3,1fr);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line);z-index:20}
.nav-btn{border:0;background:none;padding:5px;color:#8b817c;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav-btn span{font-size:22px}
.nav-btn.active{color:var(--green-strong);font-weight:800}
.empty{padding:24px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}
@media (min-width:650px){.category-grid{grid-template-columns:repeat(4,1fr)}}

</style>
  <title>L'Art des Recettes</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">MON LIVRE DE CUISINE</p>
        <h1>L’Art des Recettes</h1>
      </div>
      <button id="addRecipeBtn" class="icon-btn" aria-label="Ajouter une recette">＋</button>
    </header>

    <main>
      <section id="homeView" class="view active">
        <div class="search-wrap">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="Rechercher une recette, un ingrédient…" />
        </div>

        <section class="hero-card">
          <div>
            <p class="eyebrow">À PORTÉE DE MAIN</p>
            <h2>Vos recettes, bien classées et toujours prêtes.</h2>
            <p>Adaptez instantanément les quantités au nombre de convives.</p>
          </div>
          <div class="hero-mark">👨‍🍳</div>
        </section>

        <div class="section-title-row">
          <h3>Catégories</h3>
          <button id="showAllBtn" class="text-btn">Tout voir</button>
        </div>
        <div id="categoryGrid" class="category-grid"></div>

        <div class="section-title-row">
          <h3>Recettes</h3>
          <span id="recipeCount" class="muted"></span>
        </div>
        <div id="recipeList" class="recipe-list"></div>
      </section>

      <section id="recipeView" class="view">
        <button id="backBtn" class="back-btn">‹ Retour</button>
        <article id="recipeDetail"></article>
      </section>

      <section id="favoritesView" class="view">
        <div class="section-title-row">
          <h2>Favoris</h2>
        </div>
        <div id="favoritesList" class="recipe-list"></div>
      </section>

      <section id="addView" class="view">
        <button id="backFromAddBtn" class="back-btn">‹ Retour</button>
        <h2>Ajouter une recette</h2>
        <form id="recipeForm" class="recipe-form">
          <label>Nom de la recette
            <input id="formTitle" required placeholder="Ex. Filet mignon braisé" />
          </label>
          <label>Catégorie
            <select id="formCategory">
              <option>Viandes</option>
              <option>Poissons</option>
              <option>Entrées</option>
              <option>Accompagnements</option>
              <option>Desserts</option>
              <option>Sauces</option>
              <option>Seniors</option>
              <option>Collectivité</option>
              <option>Personnel</option>
            </select>
          </label>
          <label>Nombre de portions de base
            <input id="formServings" type="number" min="1" value="4" required />
          </label>
          <label>Ingrédients
            <textarea id="formIngredients" rows="7" placeholder="Un ingrédient par ligne, par exemple :
500 | g | filet mignon
20 | cl | crème
2 | pièce | échalote"></textarea>
          </label>
          <p class="hint">Format conseillé : quantité | unité | ingrédient</p>
          <label>Préparation
            <textarea id="formSteps" rows="8" placeholder="Une étape par ligne"></textarea>
          </label>
          <label>Cuisson / température
            <input id="formCooking" placeholder="Ex. 160 °C – 35 min" />
          </label>
          <label>Notes
            <textarea id="formNotes" rows="4" placeholder="Conseils de service, variantes, organisation…"></textarea>
          </label>
          <button class="primary-btn" type="submit">Enregistrer la recette</button>
        </form>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-nav="home" class="nav-btn active"><span>⌂</span><small>Accueil</small></button>
      <button data-nav="favorites" class="nav-btn"><span>♡</span><small>Favoris</small></button>
      <button data-nav="add" class="nav-btn"><span>＋</span><small>Ajouter</small></button>
    </nav>
  </div>

  <script>

const categories = [
  ["Viandes","🥩"],["Poissons","🐟"],["Entrées","🥗"],["Accompagnements","🥕"],
  ["Desserts","🍰"],["Sauces","🥣"],["Seniors","👴"],["Collectivité","🏫"],["Personnel","⭐"]
];

const starterRecipes = [
  {
    id: "poulet-supreme",
    title: "Poulet sauce suprême",
    category: "Viandes",
    servings: 4,
    icon: "🍗",
    cooking: "Cuisson douce – viser une viande juteuse",
    ingredients: [
      {qty: 600, unit:"g", name:"blancs ou hauts de cuisse de poulet"},
      {qty: 25, unit:"g", name:"beurre"},
      {qty: 25, unit:"g", name:"farine"},
      {qty: 40, unit:"cl", name:"fond de volaille"},
      {qty: 15, unit:"cl", name:"crème entière"},
      {qty: 1, unit:"c. à café", name:"jus de citron"},
      {qty: 1, unit:"pincée", name:"muscade"},
    ],
    steps: [
      "Colorer doucement le poulet puis terminer la cuisson sans le dessécher.",
      "Réaliser un roux blond avec le beurre et la farine.",
      "Ajouter progressivement le fond de volaille et cuire jusqu’à texture nappante.",
      "Ajouter la crème, assaisonner puis terminer avec le citron.",
      "Napper le poulet juste avant le service."
    ],
    notes: "Très bon avec riz pilaf, légumes glacés ou pommes vapeur."
  },
  {
    id: "croque-chevre",
    title: "Croque-monsieur jambon chèvre",
    category: "Seniors",
    servings: 4,
    icon: "🥪",
    cooking: "Four 180 °C – environ 10 à 12 min",
    ingredients: [
      {qty: 8, unit:"tranches", name:"pain de mie"},
      {qty: 4, unit:"tranches", name:"jambon blanc"},
      {qty: 120, unit:"g", name:"chèvre doux"},
      {qty: 12, unit:"cl", name:"béchamel légère"},
      {qty: 40, unit:"g", name:"emmental râpé"}
    ],
    steps: [
      "Tartiner légèrement le pain de béchamel.",
      "Ajouter le jambon puis le chèvre.",
      "Refermer, napper très légèrement le dessus et parsemer d’emmental.",
      "Cuire jusqu’à coloration, en gardant un intérieur moelleux."
    ],
    notes: "Pour un public senior, éviter une cuisson trop sèche et privilégier un chèvre doux."
  },
  {
    id: "muffins-courgette-chorizo",
    title: "Muffins courgette chorizo",
    category: "Entrées",
    servings: 12,
    icon: "🧁",
    cooking: "Four 175 °C – environ 20 à 24 min",
    ingredients: [
      {qty: 250, unit:"g", name:"courgette"},
      {qty: 120, unit:"g", name:"chorizo"},
      {qty: 220, unit:"g", name:"farine"},
      {qty: 3, unit:"pièces", name:"œufs"},
      {qty: 12, unit:"cl", name:"lait"},
      {qty: 8, unit:"cl", name:"huile"},
      {qty: 80, unit:"g", name:"fromage râpé"}
    ],
    steps: [
      "Râper la courgette puis l’essorer soigneusement.",
      "Mélanger les éléments secs séparément des éléments liquides.",
      "Réunir sans trop travailler la pâte.",
      "Ajouter courgette, chorizo et fromage.",
      "Répartir dans 12 moules individuels et cuire jusqu’à légère coloration."
    ],
    notes: "Servir tiède ou froid. La courgette doit être bien essorée pour éviter une pâte humide."
  }
];

let recipes = JSON.parse(localStorage.getItem("lar-recipes") || "null") || starterRecipes;
let favorites = JSON.parse(localStorage.getItem("lar-favorites") || "[]");
let activeCategory = null;
let currentRecipeId = null;
let currentServings = null;

const qs = (s)=>document.querySelector(s);
const qsa = (s)=>[...document.querySelectorAll(s)];

function save(){
  localStorage.setItem("lar-recipes", JSON.stringify(recipes));
  localStorage.setItem("lar-favorites", JSON.stringify(favorites));
}

function setView(name){
  qsa(".view").forEach(v=>v.classList.remove("active"));
  qs(`#${name}View`).classList.add("active");
  qsa(".nav-btn").forEach(b=>b.classList.toggle("active", b.dataset.nav === name));
  window.scrollTo({top:0, behavior:"smooth"});
}

function renderCategories(){
  const grid = qs("#categoryGrid");
  grid.innerHTML = "";
  categories.forEach(([name,emoji])=>{
    const count = recipes.filter(r=>r.category===name).length;
    const btn = document.createElement("button");
    btn.className = "category-card";
    btn.innerHTML = `<span class="emoji">${emoji}</span><strong>${name}</strong><small>${count} recette${count>1?"s":""}</small>`;
    btn.onclick = ()=>{ activeCategory=name; qs("#searchInput").value=""; renderRecipes(); };
    grid.appendChild(btn);
  });
}

function filteredRecipes(){
  const term = qs("#searchInput").value.trim().toLowerCase();
  return recipes.filter(r=>{
    const matchesCategory = !activeCategory || r.category===activeCategory;
    const haystack = [r.title,r.category,r.notes,...r.ingredients.map(i=>i.name)].join(" ").toLowerCase();
    return matchesCategory && (!term || haystack.includes(term));
  });
}

function recipeCard(r){
  const isFav = favorites.includes(r.id);
  return `<div class="recipe-card" data-id="${r.id}">
    <div class="recipe-thumb">${r.icon || "🍽️"}</div>
    <div class="recipe-meta">
      <h4>${r.title}</h4>
      <p>${r.category} · Base ${r.servings} portion${r.servings>1?"s":""}</p>
    </div>
    <div>
      <button class="fav-btn" data-fav="${r.id}" aria-label="Favori">${isFav?"♥":"♡"}</button>
      <button class="open-btn" data-open="${r.id}" aria-label="Ouvrir">›</button>
    </div>
  </div>`;
}

function wireCards(container){
  container.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openRecipe(b.dataset.open));
  container.querySelectorAll("[data-fav]").forEach(b=>b.onclick=()=>{
    toggleFavorite(b.dataset.fav);
    renderRecipes();
    renderFavorites();
  });
}

function renderRecipes(){
  const list = filteredRecipes();
  qs("#recipeCount").textContent = `${list.length} recette${list.length>1?"s":""}`;
  qs("#recipeList").innerHTML = list.length ? list.map(recipeCard).join("") : `<div class="empty">Aucune recette trouvée.</div>`;
  wireCards(qs("#recipeList"));
}

function renderFavorites(){
  const list = recipes.filter(r=>favorites.includes(r.id));
  qs("#favoritesList").innerHTML = list.length ? list.map(recipeCard).join("") : `<div class="empty">Aucun favori pour le moment.</div>`;
  wireCards(qs("#favoritesList"));
}

function toggleFavorite(id){
  favorites = favorites.includes(id) ? favorites.filter(x=>x!==id) : [...favorites,id];
  save();
}

function formatQty(n){
  if (typeof n !== "number") return n;
  const rounded = Math.round(n*100)/100;
  return Number.isInteger(rounded) ? rounded.toString() : rounded.toString().replace(".",",");
}

function openRecipe(id){
  currentRecipeId = id;
  const r = recipes.find(x=>x.id===id);
  currentServings = r.servings;
  renderRecipeDetail();
  setView("recipe");
}

function renderRecipeDetail(){
  const r = recipes.find(x=>x.id===currentRecipeId);
  if(!r) return;
  const factor = currentServings / r.servings;
  const isFav = favorites.includes(r.id);
  qs("#recipeDetail").innerHTML = `
    <div class="detail-card">
      <div class="detail-hero">
        <div class="dish-icon">${r.icon || "🍽️"}</div>
        <h2>${r.title}</h2>
        <p>${r.category}</p>
      </div>
      <div class="detail-body">
        <div class="servings-control">
          <div><strong>Nombre de portions</strong><br><span class="muted">Base : ${r.servings}</span></div>
          <div class="stepper">
            <button id="minusServing">−</button>
            <strong>${currentServings}</strong>
            <button id="plusServing">＋</button>
          </div>
        </div>

        <h3>Ingrédients</h3>
        <ul class="ingredients">
          ${r.ingredients.map(i=>`<li><span class="qty">${formatQty(i.qty*factor)} ${i.unit}</span><span>${i.name}</span></li>`).join("")}
        </ul>

        <h3>Préparation</h3>
        <ol class="steps">${r.steps.map(s=>`<li>${s}</li>`).join("")}</ol>

        ${r.cooking ? `<div class="info-box"><strong>Cuisson</strong><br>${r.cooking}</div>` : ""}
        ${r.notes ? `<div class="note-box"><strong>Notes</strong><br>${r.notes}</div>` : ""}

        <div class="detail-actions">
          <button id="detailFavBtn" class="secondary-btn">${isFav?"♥ Retirer des favoris":"♡ Ajouter aux favoris"}</button>
        </div>
      </div>
    </div>`;

  qs("#minusServing").onclick=()=>{ if(currentServings>1){currentServings--;renderRecipeDetail();}};
  qs("#plusServing").onclick=()=>{ currentServings++;renderRecipeDetail();};
  qs("#detailFavBtn").onclick=()=>{toggleFavorite(r.id);renderRecipeDetail();renderFavorites();};
}

function parseIngredients(text){
  return text.split("\n").map(x=>x.trim()).filter(Boolean).map(line=>{
    const parts = line.split("|").map(x=>x.trim());
    let qty = parseFloat((parts[0]||"1").replace(",","."));
    if(Number.isNaN(qty)) qty = 1;
    return {qty, unit: parts[1]||"", name: parts.slice(2).join(" | ") || parts[0]};
  });
}

function slugify(t){
  return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") + "-" + Date.now();
}

qs("#recipeForm").addEventListener("submit",(e)=>{
  e.preventDefault();
  const title = qs("#formTitle").value.trim();
  const ingredients = parseIngredients(qs("#formIngredients").value);
  const steps = qs("#formSteps").value.split("\n").map(x=>x.trim()).filter(Boolean);
  recipes.unshift({
    id: slugify(title),
    title,
    category: qs("#formCategory").value,
    servings: Number(qs("#formServings").value)||1,
    icon: "🍽️",
    cooking: qs("#formCooking").value.trim(),
    ingredients,
    steps,
    notes: qs("#formNotes").value.trim()
  });
  save();
  e.target.reset();
  qs("#formServings").value = 4;
  activeCategory = null;
  renderCategories();
  renderRecipes();
  setView("home");
});

qs("#searchInput").addEventListener("input",()=>{activeCategory=null;renderRecipes();});
qs("#showAllBtn").onclick=()=>{activeCategory=null;qs("#searchInput").value="";renderRecipes();};
qs("#addRecipeBtn").onclick=()=>setView("add");
qs("#backBtn").onclick=()=>setView("home");
qs("#backFromAddBtn").onclick=()=>setView("home");

qsa(".nav-btn").forEach(btn=>btn.onclick=()=>{
  const n = btn.dataset.nav;
  if(n==="home") setView("home");
  if(n==="favorites"){renderFavorites();setView("favorites");}
  if(n==="add") setView("add");
});

renderCategories();
renderRecipes();
renderFavorites();


</script>
</body>
</html>
